name: Build ocijail

on:
  push:
    branches: [main]
    paths:
      - 'sysutils/ocijail/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            vm_arch: ""
            vm_sync: rsync
          - arch: aarch64
            vm_arch: "aarch64"
            vm_sync: rsync
          # riscv64 excluded - FreeBSD 15 riscv64 has no packages yet

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Build in FreeBSD VM (${{ matrix.arch }})
        uses: vmactions/freebsd-vm@v1.3.5
        with:
          release: "15.0"
          vnc_password: ${{ secrets.VNC_PASSWORD }}
          arch: ${{ matrix.vm_arch }}
          sync: ${{ matrix.vm_sync }}
          usesh: true
          copyback: true
          prepare: |
            pkg install -y bazel5 bash

            # Fetch ports tarball and extract only what we need (no git dependency)
            fetch -qo /tmp/ports.tar.gz https://github.com/freebsd/freebsd-ports/archive/refs/heads/main.tar.gz
            mkdir -p /usr/ports
            tar -xzf /tmp/ports.tar.gz -C /usr/ports --strip-components=1 \
              'freebsd-ports-main/Mk' \
              'freebsd-ports-main/Templates' \
              'freebsd-ports-main/Keywords' \
              'freebsd-ports-main/sysutils/ocijail'
            rm /tmp/ports.tar.gz
          run: |
            set -e

            # Overlay our patched port
            cp -r sysutils/ocijail/* /usr/ports/sysutils/ocijail/

            # Build package
            cd /usr/ports/sysutils/ocijail
            make package

            # Package is created in work/pkg/ - copy to workspace for artifact upload
            ls -la work/pkg/
            cp work/pkg/ocijail-*.pkg $GITHUB_WORKSPACE/ocijail-${{ matrix.arch }}.pkg
            ls -la $GITHUB_WORKSPACE/*.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: ocijail-${{ matrix.arch }}
          path: "*.pkg"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pkgs/
          merge-multiple: true

      - name: List packages
        run: ls -la pkgs/

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: ocijail (patched)
          body: |
            Patched ocijail with `allow.*` annotation support for FreeBSD jail parameters.

            Install:
            ```sh
            # amd64
            doas pkg add https://github.com/daemonless/freebsd-ports/releases/latest/download/ocijail-amd64.pkg

            # aarch64
            doas pkg add https://github.com/daemonless/freebsd-ports/releases/latest/download/ocijail-aarch64.pkg
            ```
          files: pkgs/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
